x-base: &base
  image: revela
  build: .
  platform: linux/amd64 # o fotobuch só publica binário Linux x86_64
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp
    TZ: ${TZ:-America/Sao_Paulo} # define o dia de cada pasta
    BOOK: ${BOOK:-livro}

services:
  sync:
    <<: *base
    env_file: [{ path: .env, required: false }]
    volumes: [./data:/data]
    entrypoint: [revela-sync]

  revela:
    <<: *base
    network_mode: none
    volumes:
      - ./data:/data
      - ./data/selected:/photos:ro # o mesmo /photos que o fotobuch enxerga
    entrypoint: [revela]

  picker:
    <<: *base
    ports: ["127.0.0.1:8765:8765"]
    volumes: [./data:/data]
    entrypoint: [revela, picker]

  fotobuch:
    <<: *base
    network_mode: none
    working_dir: /books/${BOOK:-livro} # um diretório por livro
    volumes:
      - ./data/selected:/photos:ro
      - ./data/books:/books
    entrypoint: [fotobuch]
