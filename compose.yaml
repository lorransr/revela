x-base: &base
  image: revela
  build: .
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp
    TZ: ${TZ:-America/Sao_Paulo} # sets the day of each folder
  volumes: [./data:/data]

services:
  sync:
    <<: *base
    env_file: [{ path: .env, required: false }]
    entrypoint: [revela-sync]

  revela:
    <<: *base
    network_mode: none
    entrypoint: [revela]

  review:
    <<: *base
    ports: ["127.0.0.1:8765:8765"]
    entrypoint: [revela, review]
