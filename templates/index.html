<!doctype html>
<html lang="pt-br">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>revela</title>
<script src="/static/htmx.min.js"></script>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #111; color: #eee; font: 16px system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  nav { position: fixed; top: 0; right: 0; padding: .8em 1em; }
  nav a { color: #9cf; margin-left: 1em; }
  #card { display: flex; flex-direction: column; align-items: center; }
  #card img { display: block; max-width: 92vw; max-height: 70vh; border-radius: 12px; transition: transform .15s; }
  #card.go-in img { transform: translateX(120vw) rotate(20deg); }
  #card.go-out img { transform: translateX(-120vw) rotate(-20deg); }
  .progress { color: #aaa; margin: .4em; }
  .hint { min-height: 1.4em; margin: .6em; color: #fc6; }
  .tag { padding: .1em .6em; border-radius: 6px; font-weight: bold; }
  button { font-size: 1.3em; margin: 0 .5em; padding: .4em 1.1em; border-radius: 2em; border: 0; cursor: pointer; }
  .out { background: #e55; color: #fff; } .in { background: #4b6; color: #fff; }
</style>
<body hx-target="#card" hx-swap="outerHTML swap:150ms">
<nav>
  <a href="/">todas</a>
  <a href="/?fora=1">só sugestões de descarte</a>
  <a href="/album" target="_blank">ver o álbum</a>
</nav>
{% include "card.html" %}
<script>
  // Arrastar a foto para o lado decide como os botões. O resto fica no HTMX.
  let x0 = null;
  const img = () => document.querySelector("#card img");
  addEventListener("pointerdown", e => { if (e.target === img()) { x0 = e.clientX; img().style.transition = "none"; } });
  addEventListener("pointermove", e => {
    if (x0 !== null) img().style.transform = `translateX(${e.clientX - x0}px) rotate(${(e.clientX - x0) / 20}deg)`;
  });
  addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0;
    x0 = null;
    img().style.transition = img().style.transform = "";
    if (Math.abs(dx) > 100) htmx.trigger(dx > 0 ? "#btn-in" : "#btn-out", "click");
  });
</script>
</body>
</html>
